[Unit]
# Avoid ordering the service after the target that pulls it in.
After=
After=crankshaft-core.service crankshaft-ui-slim-display-setup.service systemd-user-sessions.service
Conflicts=rk3326-hwtest.service getty@tty1.service

[Service]
StandardInput=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
# Use the tablet DRM/KMS display; do not fall back to VNC.
EnvironmentFile=
Environment=QT_QPA_PLATFORM=eglfs
Environment=QT_QPA_EGLFS_INTEGRATION=eglfs_kms
Environment=SLIM_UI_DISPLAY_MODE=physical
# Measure resource use without upstream's 80% CPU cap during bring-up.
CPUQuota=
MemoryMax=512M
